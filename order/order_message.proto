syntax = "proto3";

package order;

import "user/user_message.proto";

option java_package = "com.nuclei.order.proto";
option java_multiple_files = true;

message OrderItemRequest {
  int64 product_id = 1;
  int32 quantity = 2;
}

message CreateOrderRequest {
  string idempotency_key = 1;
  repeated OrderItemRequest items = 2;
  user.UserResponse user = 3;
}

message OrderItemResponse {
  int64 product_id = 1;
  string product_name = 2;
  string unit_price = 3;
  int32 quantity = 4;
  string subtotal = 5;
}

message OrderResponse {
  int64 order_id = 1;
  int64 user_id = 2;
  repeated OrderItemResponse items = 3;
  string total_amount = 4;
  string status = 5;
}

message GetOrderRequest {
  int64 order_id = 1;
  int64 user_id = 2;
}