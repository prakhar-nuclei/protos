syntax = "proto3";

package user;

option java_package = "com.nuclei.user.proto";
option java_multiple_files = true;

message CreateUserRequest {
  string name = 1;
  string email = 2;
  string password = 3;
}

message GetUserRequest {
  int64 user_id = 1;
}

message AuthenticateUserRequest {
  string email = 1;
  string password = 2;
}

message UserResponse {
  int64 user_id = 1;
  string name = 2;
  string email = 3;
}

message AuthenticateUserResponse {
  string access_token = 1;
}