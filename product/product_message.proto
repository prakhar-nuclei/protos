syntax = "proto3";

package product;

option java_package = "com.nuclei.product.proto";
option java_multiple_files = true;

message GetProductRequest {
  int64 product_id = 1;
}


message UpdateStockRequest {
  int64 product_id = 1;
  int32 quantity = 2;
  string operation_id = 3;
  StockOperationDirection direction = 4;
}



message CompensateStockRequest {
  int64 product_id = 1;
  int32 quantity = 2;
  string compensation_id = 3;
  StockOperationDirection direction = 4;
}


message CreateProductRequest {
  string name = 1;
  string price = 2;
  int32 stock = 3;
}

message UpdateProductRequest {
  int64 product_id = 1;
  string name = 2;
  string price = 3;
  int32 stock = 4;
}

message DeleteProductRequest {
  int64 product_id = 1;
}


enum StockOperationDirection {
  STOCK_OPERATION_DIRECTION_UNSPECIFIED = 0;
  INCREASE = 1;
  DECREASE = 2;
}


message ProductResponse {
  int64 product_id = 1;
  string name = 2;
  string price = 3;
  int32 stock = 4;
}