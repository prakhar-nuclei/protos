syntax = "proto3";

package product;

option java_package = "com.nuclei.product.proto";
option java_multiple_files = true;

message GetProductRequest {
  int64 product_id = 1;
}

message UpdateStockRequest {
  int64 product_id = 1;
  int32 quantity = 2;
}

message CreateProductRequest {
  string name = 1;
  string price = 2;
  int32 stock = 3;
}

message UpdateProductRequest {
  int64 product_id = 1;
  string name = 2;
  string price = 3;
  int32 stock = 4;
}

message DeleteProductRequest {
  int64 product_id = 1;
}

message ProductResponse {
  int64 product_id = 1;
  string name = 2;
  string price = 3;
  int32 stock = 4;
}